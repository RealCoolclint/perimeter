<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Perimeter — parcours en 4 étapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1ECDF;
    --ink: #1E1B15;
    --ink-soft: #6B6355;
    --ink-pale: #A79E8C;
    --hairline: #C7BDA6;
    --rubric: #A13A22;
    --sage: #5C7A5E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 56px 24px; }
  .page { width: 100%; max-width: 680px; }

  .stepper { display: flex; justify-content: center; gap: 14px; margin-bottom: 40px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.4px solid var(--ink); background: transparent; cursor: pointer; padding: 0; }
  .dot.done { background: var(--ink); }
  .dot.current { background: var(--ink); box-shadow: 0 0 0 3px var(--paper), 0 0 0 4.4px var(--ink); }

  .hairline { border: none; border-top: 1px solid var(--hairline); margin: 0; }
  .head-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 12px; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 25px; margin: 0; text-align: center; }
  .subhead { text-align: center; margin: 4px 0 40px; color: var(--ink-soft); font-size: 14px; }

  .step { display: none; }
  .step.active { display: block; }

  .circle-wrap { position: relative; width: 100%; max-width: 520px; margin: 0 auto; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .ring { fill: var(--ink); }
  .ring.faded { fill: var(--ink-pale); }
  .leader { stroke: var(--hairline); stroke-width: 1; fill: none; }
  .leader-dot { fill: var(--ink); }
  .label { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; font-size: 13.5px; fill: var(--ink); }
  .readout { font-family: 'IBM Plex Mono', monospace; font-size: 10px; fill: var(--ink-soft); letter-spacing: 0.03em; }
  .caution-flag { fill: var(--rubric); }
  .caution-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; fill: var(--paper); letter-spacing: 0.06em; }
  .center-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; fill: var(--ink-pale); letter-spacing: 0.08em; }
  .center-value { font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 22px; fill: var(--ink); }

  .go-btn {
    display: block; margin: 36px auto 0; font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
    background: none; border: 1.4px solid var(--ink); color: var(--ink);
    padding: 12px 30px; cursor: pointer;
  }
  .go-btn:hover { background: var(--ink); color: var(--paper); }

  .report-row { display: flex; gap: 28px; align-items: flex-start; }
  .medallion { width: 150px; flex-shrink: 0; }
  .actions { flex: 1; }
  .action-item { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
  .action-item:first-child { border-top: 1px solid var(--hairline); }
  .action-rank { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-pale); width: 22px; flex-shrink: 0; }
  .action-name { font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 14.5px; flex: 1; }
  .action-note { font-size: 12.5px; color: var(--ink-soft); margin-left: 8px; }
  .action-flag { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--rubric); letter-spacing: 0.05em; margin-left: 10px; }

  .progress-track { height: 3px; background: var(--hairline); margin-top: 24px; }
  .progress-fill { height: 3px; background: var(--ink); width: 0%; }

  .compare-row { display: flex; gap: 40px; justify-content: center; }
  .compare-col { text-align: center; }
  .compare-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px; }
  .compare-circle { width: 200px; }

  .delta-list { margin-top: 32px; }
  .delta-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--hairline); }
  .delta-item:first-child { border-top: 1px solid var(--hairline); }
  .delta-name { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; }
  .delta-value { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .delta-value.down { color: var(--sage); }

  .nav-row { display: flex; justify-content: space-between; margin-top: 44px; }
  .nav-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 4px; }
  .nav-btn:hover { color: var(--ink); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .foot-row { display: flex; justify-content: space-between; padding: 12px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: var(--ink-pale); }
</style>
</head>
<body>

<div class="page">

  <div class="stepper" id="stepper">
    <button class="dot" data-step="1" aria-label="Étape 1"></button>
    <button class="dot" data-step="2" aria-label="Étape 2"></button>
    <button class="dot" data-step="3" aria-label="Étape 3"></button>
    <button class="dot" data-step="4" aria-label="Étape 4"></button>
  </div>

  <hr class="hairline">
  <div class="head-row">
    <span class="eyebrow">Perimeter</span>
    <span class="eyebrow" id="stepLabel">étape 1 / 4</span>
  </div>
  <hr class="hairline">

  <!-- STEP 1 — Ouverture / lancement -->
  <section class="step" data-step="1">
    <h1>Bonjour, Martin</h1>
    <p class="subhead">le tracé du jour n'a pas encore commencé</p>
    <div class="circle-wrap">
      <svg viewBox="0 0 640 640" overflow="visible">
        <defs>
          <filter id="wobble1" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="2" seed="5" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <path id="ringPath1" class="ring" filter="url(#wobble1)" fill-rule="evenodd"></path>
        <text x="320" y="312" text-anchor="middle" class="center-eyebrow">dernier tour</text>
        <text x="320" y="334" text-anchor="middle" class="center-value" style="font-size:16px;">hier, 18h40</text>
      </svg>
    </div>
    <button class="go-btn" id="launchBtn">Lancer le tour</button>
  </section>

  <!-- STEP 2 — Tracé -->
  <section class="step" data-step="2">
    <h1>Le tracé de ce matin</h1>
    <p class="subhead">quatre azimuts, un seul trait</p>
    <div class="circle-wrap">
      <svg viewBox="0 0 640 640" overflow="visible">
        <defs>
          <filter id="wobble2" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="2" seed="8" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <path id="ringPath2" class="ring" filter="url(#wobble2)" fill-rule="evenodd"></path>
        <text x="320" y="312" text-anchor="middle" class="center-eyebrow">charge totale</text>
        <text x="320" y="338" text-anchor="middle" class="center-value" id="centerValue2">48</text>
        <g id="leadersGroup2"></g>
        <g id="labelsGroup2"></g>
      </svg>
    </div>
  </section>

  <!-- STEP 3 — Compte-rendu -->
  <section class="step" data-step="3">
    <h1>Ce que le tour a trouvé</h1>
    <p class="subhead">priorité à la charge la plus haute</p>
    <div class="report-row">
      <div class="medallion">
        <svg viewBox="0 0 640 640" overflow="visible">
          <defs>
            <filter id="wobble3" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="2" seed="8" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
          <path id="ringPath3" class="ring" filter="url(#wobble3)" fill-rule="evenodd"></path>
        </svg>
      </div>
      <div class="actions" id="actionsList"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </section>

  <!-- STEP 4 — Avant / après -->
  <section class="step" data-step="4">
    <h1>Fin de tour</h1>
    <p class="subhead">ce qui s'est allégé</p>
    <div class="compare-row">
      <div class="compare-col">
        <div class="compare-label">avant</div>
        <svg class="compare-circle" viewBox="0 0 640 640" overflow="visible">
          <path id="ringPathBefore" class="ring faded" fill-rule="evenodd"></path>
        </svg>
      </div>
      <div class="compare-col">
        <div class="compare-label">après</div>
        <svg class="compare-circle" viewBox="0 0 640 640" overflow="visible">
          <defs>
            <filter id="wobble4" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="2" seed="12" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
          <path id="ringPathAfter" class="ring" filter="url(#wobble4)" fill-rule="evenodd"></path>
        </svg>
      </div>
    </div>
    <div class="delta-list" id="deltaList"></div>
  </section>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">← précédent</button>
    <button class="nav-btn" id="nextBtn">suivant →</button>
  </div>

  <div class="foot-row">
    <span id="footLeft">tracé — étape 1 / 4</span>
    <span id="footRight">en attente de lancement</span>
  </div>

</div>

<script>
  const cx = 320, cy = 320, outerR = 230, baseInnerR = 190;
  const MIN_THICK = 14, MAX_THICK = 64;

  const azimutsAvant = [
    { name: "Calendrier & temps", mid: -45, charge: 0.32, points: 2, seuil: false, note: "2 points ouverts" },
    { name: "Pilotage de projets", mid: 45,  charge: 0.5,  points: 5, seuil: false, note: "5 chantiers Monday" },
    { name: "Carrière & opportunités", mid: 135, charge: 0.88, points: 3, seuil: true, note: "3 candidatures en attente" },
    { name: "Management d'équipe", mid: 225, charge: 0.18, points: 1, seuil: false, note: "1 point, un 1-to-1 à recaler" }
  ];

  const azimutsApres = azimutsAvant.map(a => ({
    ...a,
    charge: a.name === "Carrière & opportunités" ? 0.4 : a.name === "Pilotage de projets" ? 0.35 : a.charge,
    seuil: false
  }));

  const azimutsNeutres = azimutsAvant.map(a => ({ ...a, charge: 0.08, seuil: false }));

  function norm(a) { let x = a % 360; if (x < 0) x += 360; return x; }

  function chargeAt(azimuts, angleDeg) {
    const a = norm(angleDeg);
    for (let i = 0; i < azimuts.length; i++) {
      const m = norm(azimuts[i].mid);
      const mNext = norm(azimuts[(i + 1) % azimuts.length].mid);
      let span = mNext - m; if (span <= 0) span += 360;
      let rel = a - m; if (rel < 0) rel += 360;
      if (rel <= span) {
        const next = azimuts[(i + 1) % azimuts.length];
        const t = rel / span;
        const smooth = t * t * (3 - 2 * t);
        return azimuts[i].charge + (next.charge - azimuts[i].charge) * smooth;
      }
    }
    return azimuts[0].charge;
  }

  function polar(px, py, angleDeg, radius) {
    const a = (angleDeg * Math.PI) / 180;
    return { x: px + radius * Math.cos(a), y: py + radius * Math.sin(a) };
  }

  function buildRingPath(azimuts, ocx, ocy, oOuterR) {
    const N = 140;
    let outer = [], inner = [];
    for (let i = 0; i <= N; i++) {
      const ang = (360 / N) * i;
      const c = chargeAt(azimuts, ang);
      const thickness = MIN_THICK + c * (MAX_THICK - MIN_THICK);
      outer.push(polar(ocx, ocy, ang, oOuterR));
      inner.push(polar(ocx, ocy, ang, oOuterR - thickness));
    }
    let d = `M ${outer[0].x.toFixed(2)} ${outer[0].y.toFixed(2)} `;
    outer.slice(1).forEach(p => d += `L ${p.x.toFixed(2)} ${p.y.toFixed(2)} `);
    d += 'Z ';
    d += `M ${inner[0].x.toFixed(2)} ${inner[0].y.toFixed(2)} `;
    inner.slice(1).reverse().forEach(p => d += `L ${p.x.toFixed(2)} ${p.y.toFixed(2)} `);
    d += 'Z';
    return d;
  }

  document.getElementById('ringPath1').setAttribute('d', buildRingPath(azimutsNeutres, cx, cy, outerR));
  document.getElementById('ringPath2').setAttribute('d', buildRingPath(azimutsAvant, cx, cy, outerR));
  document.getElementById('ringPath3').setAttribute('d', buildRingPath(azimutsAvant, cx, cy, outerR));
  document.getElementById('ringPathBefore').setAttribute('d', buildRingPath(azimutsAvant, cx, cy, outerR));
  document.getElementById('ringPathAfter').setAttribute('d', buildRingPath(azimutsApres, cx, cy, outerR));

  const leaders2 = document.getElementById('leadersGroup2');
  const labels2 = document.getElementById('labelsGroup2');

  azimutsAvant.forEach((az) => {
    const onRing = polar(cx, cy, az.mid, outerR);
    const bend = polar(cx, cy, az.mid, outerR + 34);
    const lp = polar(cx, cy, az.mid, outerR + 40);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', `${onRing.x.toFixed(1)},${onRing.y.toFixed(1)} ${bend.x.toFixed(1)},${bend.y.toFixed(1)} ${lp.x.toFixed(1)},${lp.y.toFixed(1)}`);
    line.setAttribute('class', 'leader');
    leaders2.appendChild(line);

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', onRing.x.toFixed(1)); dot.setAttribute('cy', onRing.y.toFixed(1));
    dot.setAttribute('r', 3); dot.setAttribute('class', 'leader-dot');
    leaders2.appendChild(dot);

    const cos = Math.cos((az.mid * Math.PI) / 180);
    const anchor = Math.abs(cos) < 0.35 ? 'middle' : (cos > 0 ? 'start' : 'end');
    const dx = anchor === 'start' ? 8 : anchor === 'end' ? -8 : 0;

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', (lp.x + dx).toFixed(1)); text.setAttribute('y', lp.y.toFixed(1));
    text.setAttribute('text-anchor', anchor); text.setAttribute('class', 'label');
    text.textContent = az.name;
    labels2.appendChild(text);

    const readout = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    readout.setAttribute('x', (lp.x + dx).toFixed(1)); readout.setAttribute('y', (lp.y + 16).toFixed(1));
    readout.setAttribute('text-anchor', anchor); readout.setAttribute('class', 'readout');
    readout.textContent = `${az.points} pts`;
    labels2.appendChild(readout);

    if (az.seuil) {
      const fx = anchor === 'start' ? lp.x - 14 : anchor === 'end' ? lp.x + 14 : lp.x + 46;
      const fy = lp.y - 4;
      const flag = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      flag.setAttribute('d', `M ${fx} ${fy} h 28 l -6 6 l 6 6 h -28 Z`);
      flag.setAttribute('class', 'caution-flag');
      labels2.appendChild(flag);
      const ft = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      ft.setAttribute('x', fx + 3); ft.setAttribute('y', fy + 9);
      ft.setAttribute('class', 'caution-label'); ft.textContent = 'seuil';
      labels2.appendChild(ft);
    }
  });

  const actionsList = document.getElementById('actionsList');
  [...azimutsAvant].sort((a, b) => b.charge - a.charge).forEach((az, i) => {
    const row = document.createElement('div'); row.className = 'action-item';
    row.innerHTML = `<span class="action-rank">${(i + 1).toString().padStart(2, '0')}</span>
      <span class="action-name">${az.name}<span class="action-note"> — ${az.note}</span></span>
      ${az.seuil ? '<span class="action-flag">seuil</span>' : ''}`;
    actionsList.appendChild(row);
  });

  const deltaList = document.getElementById('deltaList');
  azimutsAvant.forEach((a, i) => {
    const b = azimutsApres[i];
    const diff = b.charge - a.charge;
    const row = document.createElement('div'); row.className = 'delta-item';
    row.innerHTML = `<span class="delta-name">${a.name}</span>
      <span class="delta-value ${diff < 0 ? 'down' : ''}">${diff <= 0 ? '' : '+'}${(diff * 100).toFixed(0)}%</span>`;
    deltaList.appendChild(row);
  });

  let currentStep = 1;
  const stepEls = document.querySelectorAll('.step');
  const dots = document.querySelectorAll('#stepper .dot');
  const stepLabel = document.getElementById('stepLabel');
  const footLeft = document.getElementById('footLeft');
  const footRight = document.getElementById('footRight');
  const footRightText = ['en attente de lancement', '1 azimut dépasse son seuil', 'plan en 4 actions', 'charge globale en baisse'];

  function render() {
    stepEls.forEach(s => s.classList.toggle('active', Number(s.dataset.step) === currentStep));
    dots.forEach(d => {
      const n = Number(d.dataset.step);
      d.classList.toggle('done', n < currentStep);
      d.classList.toggle('current', n === currentStep);
    });
    stepLabel.textContent = `étape ${currentStep} / 4`;
    footLeft.textContent = `tracé — étape ${currentStep} / 4`;
    footRight.textContent = footRightText[currentStep - 1];
    document.getElementById('prevBtn').disabled = currentStep === 1;
    document.getElementById('nextBtn').disabled = currentStep === 4;

    let sum = 0;
    if (currentStep >= 3) {
      sum = azimutsAvant.reduce((s, a) => s + a.charge, 0) / azimutsAvant.length * 100;
      document.getElementById('progressFill').style.width = '0%';
    }
  }

  dots.forEach(d => d.addEventListener('click', () => { currentStep = Number(d.dataset.step); render(); }));
  document.getElementById('prevBtn').addEventListener('click', () => { if (currentStep > 1) { currentStep--; render(); } });
  document.getElementById('nextBtn').addEventListener('click', () => { if (currentStep < 4) { currentStep++; render(); } });
  document.getElementById('launchBtn').addEventListener('click', () => { currentStep = 2; render(); });

  render();
</script>

</body>
</html>
